[project]
name = "agent-taskwatch"
version = "0.0.0"
description = "Standalone job runner for approved agent work: schedule, check, review, and deliver."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
taskwatch = "taskwatch.job_cli:main"

[tool.setuptools]
packages = ["taskwatch"]

[tool.setuptools.data-files]
"share/agent-taskwatch/review" = ["docs/review/*.md"]
"share/agent-taskwatch/launch" = ["docs/launch/*.md", "docs/launch/*.json"]
"share/agent-taskwatch/kinds" = ["docs/kinds/*.md", "docs/kinds/*.json"]

[project.urls]
Repository = "https://github.com/haesol-shin/agent-taskwatch"
Changelog = "https://github.com/haesol-shin/agent-taskwatch/blob/main/CHANGELOG.md"
Issues = "https://github.com/haesol-shin/agent-taskwatch/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
